name: Release

# release-please reads the Conventional Commits on trunk and keeps a "release" pull request
# open (version bump in version.txt + CHANGELOG.md). Merging that pull request tags the
# release; this workflow then builds the zip and attaches it to the GitHub release.
on:
  push:
    branches: [trunk]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v6
        if: steps.rp.outputs.release_created
      - name: Install the MinGW-w64 i686 cross-compiler
        if: steps.rp.outputs.release_created
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 binutils-mingw-w64-i686 make
      - name: Build and attach the release zip
        if: steps.rp.outputs.release_created
        run: |
          make dist
          gh release upload "${{ steps.rp.outputs.tag_name }}" build/urlmagic4-v*.exe build/urlmagic4-v*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

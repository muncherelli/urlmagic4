# SonarCloud automatic analysis: vendored PCRE2 and scratch code are not ours to fix
sonar.exclusions=third_party/**,spike/**

# S3806 wants <Windows.h> etc.: the mingw-w64 headers the build uses are all lower case
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=c:S3806
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
